name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-python puts `python` on PATH, which web's prebuild script calls.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover scripts

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      # prebuild runs the corpus validator first.
      - run: npm run build
        working-directory: web
